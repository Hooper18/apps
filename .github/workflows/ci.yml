name: CI

# 触发：所有 push 到 main + 所有 PR。
# 设计：两个 app 各自一份 job，跑 typecheck → vitest → build → playwright；
# concurrency 取消同分支旧跑动，避免堆积。
# Node 固定 24：与本地开发环境(node 24 / npm 11)对齐。package-lock.json 由 npm 11 生成，
# 用 node 20 / npm 10 跑 `npm ci` 会因 vite5+vitest4 的 esbuild 跨 npm 大版本解析差异
# 报「lockfile 不同步、Missing esbuild」而误红——别再把这里降回 20。
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ledger-app:
    name: ledger-app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ledger-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ledger-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit + component tests
        run: npm test

      - name: Build (含 tsc 类型检查)
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E smoke
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ledger-app-playwright-report
          path: ledger-app/playwright-report/
          retention-days: 7

  schedule-app:
    name: schedule-app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: schedule-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: schedule-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit + component tests
        run: npm test

      - name: Build (含 tsc -b 类型检查)
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E smoke
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: schedule-app-playwright-report
          path: schedule-app/playwright-report/
          retention-days: 7
